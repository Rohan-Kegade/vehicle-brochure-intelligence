name: vbi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vbi
      POSTGRES_PASSWORD: vbi
      POSTGRES_DB: vbi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbi -d vbi"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
